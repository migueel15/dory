          description: "Marks with the patch hash at marking time"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  type: "object"
                  required: ["path", "patch_hash", "reviewed_at"]
                  properties:
                    path: {type: "string"}
                    patch_hash: {type: "string"}
                    reviewed_at: {type: "string", format: "date-time"}
    put:
      operationId: "markPullReview"
      summary: "Mark a file as reviewed"
      parameters:
        - {name: "owner", in: "path", required: true, schema: {type: "string"}}
        - {name: "repo", in: "path", required: true, schema: {type: "string"}}
        - {name: "number", in: "path", required: true, schema: {type: "integer"}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required: ["path", "patch_hash"]
              properties:
                path: {type: "string"}
                patch_hash: {type: "string"}
      responses:
        "204":
          description: "Marked"
    delete:
      operationId: "unmarkPullReview"
      summary: "Remove the review mark of a file"
      parameters:
        - {name: "owner", in: "path", required: true, schema: {type: "string"}}
        - {name: "repo", in: "path", required: true, schema: {type: "string"}}
        - {name: "number", in: "path", required: true, schema: {type: "integer"}}
        - {name: "path", in: "query", required: true, schema: {type: "string"}}
      responses:
        "204":
          description: "Unmarked"
  "/github/repos/{owner}/{repo}/pulls/{number}/agent":
    get:
      operationId: "getPullAgent"
      summary: "Review thread of the pull request, if one was created"
      parameters:
        - {name: "owner", in: "path", required: true, schema: {type: "string"}}
        - {name: "repo", in: "path", required: true, schema: {type: "string"}}
        - {name: "number", in: "path", required: true, schema: {type: "integer"}}
      responses:
        "200":
          description: "Whether a thread is available"
          content:
            application/json:
              schema:
                type: "object"
                required: ["available"]
                properties:
                  available: {type: "boolean"}
                  thread_id: {type: "string"}
                  url: {type: "string"}
                  t3_environment_id: {type: "string"}
  "/github/repos/{owner}/{repo}/pulls/{number}/review-thread":
    post:
      operationId: "createPullReview"
      summary: "Create a review thread and wait for the first question"
      parameters:
        - {name: "owner", in: "path", required: true, schema: {type: "string"}}
        - {name: "repo", in: "path", required: true, schema: {type: "string"}}
        - {name: "number", in: "path", required: true, schema: {type: "integer"}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required: ["launch"]
              properties:
                launch:
                  type: "object"
                  description: "Required while the pull request has no review thread"
                  required: ["instance_id", "project_id", "provider", "model"]
                  properties:
                    instance_id: {type: "string"}
                    project_id: {type: "string"}
                    provider: {type: "string"}
                    model: {type: "string"}
                    effort_option: {type: "string"}
                    effort: {type: "string"}
      responses:
        "201":
          description: "Review thread created"
          content:
            application/json:
              schema:
                type: "object"
                required: ["available"]
                properties:
                  available: {type: "boolean"}
                  thread_id: {type: "string"}
                  url: {type: "string"}
                  t3_environment_id: {type: "string"}
        "409":
          description: "Review thread already exists"
        "400":
          description: "Missing or invalid launch"
  "/github/repos/{owner}/{repo}/pulls/{number}/ask":
    post:
      operationId: "askPullAgent"
      summary: "Send a private review question to the review thread; the first one creates it with launch"
      parameters:
        - {name: "owner", in: "path", required: true, schema: {type: "string"}}
        - {name: "repo", in: "path", required: true, schema: {type: "string"}}
        - {name: "number", in: "path", required: true, schema: {type: "integer"}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required: ["path", "start", "end", "question"]
              properties:
                path: {type: "string"}
                start: {type: "integer"}
                end: {type: "integer"}
                snippet: {type: "string"}
                question: {type: "string"}
                launch:
                  type: "object"
                  description: "Required while the pull request has no review thread"
                  required: ["instance_id", "project_id", "provider", "model"]
                  properties:
                    instance_id: {type: "string"}
                    project_id: {type: "string"}
                    provider: {type: "string"}
                    model: {type: "string"}
                    effort_option: {type: "string"}
                    effort: {type: "string"}
      responses:
        "201":
          description: "Review thread created with the question"
          content:
            application/json:
              schema:
                type: "object"
                required: ["available"]
                properties:
                  available: {type: "boolean"}
                  thread_id: {type: "string"}
                  url: {type: "string"}
                  t3_environment_id: {type: "string"}
        "200":
          description: "Sent"
          content:
            application/json:
              schema:
                type: "object"
                required: ["available"]
                properties:
                  available: {type: "boolean"}
                  thread_id: {type: "string"}
                  url: {type: "string"}
                  t3_environment_id: {type: "string"}
        "409":
          description: "No review thread yet and no launch given"
  "/t3/threads/{id}/media":
    get:
      operationId: "getThreadMedia"
      summary: "Image the agent shows by local path, proxied from the thread's machine"
      parameters:
        - {name: "id", in: "path", required: true, schema: {type: "string"}}
        - {name: "path", in: "query", required: true, schema: {type: "string", maxLength: 1024}}
      responses:
        "200":
          description: "The image"
          content:
            image/*: {}
        "415":
          description: "The file is not an image"
  "/t3/instances/{id}/pair":
    post:
      operationId: "pairT3Instance"
      summary: "Mint a one-time sign-in link for an instance"
      parameters:
        - {name: "id", in: "path", required: true, schema: {type: "string", format: "uuid"}}
      responses:
        "200":
          description: "Link"
          content:
            application/json:
              schema:
                type: "object"
                required: ["url"]
                properties:
                  url:
                    type: "string"
  "/t3/threads/{id}/context":
    get:
      operationId: "getT3ThreadContext"
      summary: "Recent messages and open request of a thread"
      parameters:
        - {name: "id", in: "path", required: true, schema: {type: "string"}}
      responses:
        "200":
          description: "Context"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/T3ThreadContext"
  "/t3/threads/{id}/stream":
    get:
      operationId: "streamT3Thread"
      description: "SSE stream of one thread while the client stays connected. Emits event: thread with {\"thread_id\"} after each burst of changes; refetch the conversation then. Ends when T3 drops the subscription. Heartbeat comments are allowed."
      parameters:
        - {name: "id", in: "path", required: true, schema: {type: "string"}}
      responses:
        "200":
          description: "Event stream"
          content:
            text/event-stream:
              schema: {type: "string"}
        "404":
          description: "No instance reports the thread"
  "/t3/threads/{id}/messages":
    post:
      operationId: "sendT3ThreadMessage"
      summary: "Send a message to a thread"
      parameters:
        - {name: "id", in: "path", required: true, schema: {type: "string"}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required: ["text"]
              properties:
                text:
                  type: "string"
      responses:
        "204":
          description: "Sent"
  "/t3/threads/{id}/requests/{request_id}":
    post:
      operationId: "respondT3ThreadRequest"
      summary: "Approve, decline or answer the open request of a thread"
      parameters:
        - {name: "id", in: "path", required: true, schema: {type: "string"}}
        - {name: "request_id", in: "path", required: true, schema: {type: "string"}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                decision:
                  type: "string"
                  enum: ["accept", "decline"]
                answers:
                  type: "object"
                  additionalProperties: true
      responses:
        "204":
          description: "Delivered"
        "409":
          description: "The request is no longer open"
  "/t3/threads/{id}/view":
    get:
      operationId: "getT3ThreadView"
      summary: "Whole conversation, native queue, settings, pull requests and linked items of a thread"
      parameters:
        - {name: "id", in: "path", required: true, schema: {type: "string"}}
      responses:
        "200":
          description: "Thread view"
          content:
            application/json:
              schema: {type: "object", additionalProperties: true}
  "/t3/threads/{id}/diff":
    get:
      operationId: "getT3ThreadDiff"
      summary: "Every change the thread made in its worktree: Dory diffs it with git when an item of the thread names a branch checked out on this machine, else T3 checkpoints"
      parameters:
        - {name: "id", in: "path", required: true, schema: {type: "string"}}
      responses:
        "200":
          description: "Unified diff, empty when no turn changed files"
          content:
            application/json:
              schema: {type: "object", required: ["diff", "source"], properties: {diff: {type: "string"}, source: {type: "string", enum: ["t3", "git"]}, branch: {type: "string"}, worktree: {type: "string"}, base: {type: "string"}}}
  "/t3/threads/{id}/actions":
    post:
      operationId: "actOnT3Thread"
      summary: "Organize a thread as T3 Code's sidebar does: rename, archive, unarchive, delete, pin, unpin, settle, unsettle, snooze, unsnooze, read, unread, stop or fork (from run_id, or the latest run)"
      parameters:
        - {name: "id", in: "path", required: true, schema: {type: "string"}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required: ["action"]
              properties:
                action: {type: "string", enum: ["rename", "archive", "unarchive", "delete", "pin", "unpin", "settle", "unsettle", "snooze", "unsnooze", "read", "unread", "stop", "fork"]}
                title: {type: "string", description: "New title (rename) or title of the fork"}
                until: {type: "string", format: "date-time", description: "End of the snooze"}
                run_id: {type: "string", description: "Run the fork copies up to"}
      responses:
        "200":
          description: "The forked thread"
          content:
            application/json:
              schema: {type: "object", required: ["thread_id"], properties: {thread_id: {type: "string"}}}
        "204":
          description: "Done"
  "/t3/threads":
    get:
      operationId: "listAllT3Threads"
      summary: "Every thread of each available instance (settled, archived and subagents included) from the monitor's last read"
      responses:
        "200":
          description: "Threads per instance"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  type: "object"
                  required: ["instance_id", "environment_id", "threads"]
                  properties:
                    instance_id: {type: "string"}
                    environment_id: {type: "string"}
                    threads: {type: "array", items: {$ref: "#/components/schemas/T3Thread"}}
    post:
      operationId: "createT3Thread"
      summary: "Start a free thread with no item: text starts the first turn, without it the chat opens empty; an item can be linked later"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required: ["instance_id", "project_id", "provider", "model"]
              properties:
                instance_id: {type: "string"}
                project_id: {type: "string"}
                provider: {type: "string"}
                model: {type: "string"}
                effort_option: {type: "string"}
                effort: {type: "string"}
                text: {type: "string"}
      responses:
        "201":
          description: "The new thread"
          content:
            application/json:
              schema: {type: "object", required: ["thread_id"], properties: {thread_id: {type: "string"}}}
  "/t3/threads/{id}/secrets/{item}":
    post:
      operationId: "answerT3SecretRequest"
      summary: "Answer a request_secret card: the secret goes straight to T3 (never logged or stored by Dory), or decline"
      parameters:
        - {name: "id", in: "path", required: true, schema: {type: "string"}}
        - {name: "item", in: "path", required: true, schema: {type: "string"}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: "object", properties: {secret: {type: "string"}, decline: {type: "boolean"}}}
      responses:
        "204":
          description: "Answered"
  "/github/repos/{owner}/{repo}/pull-refs":
    get:
      operationId: "searchGithubPullRefs"
      summary: "Pull requests of a repository in every state (open, draft, merged, closed), newest first, for # references"
      parameters:
        - {name: "owner", in: "path", required: true, schema: {type: "string"}}
        - {name: "repo", in: "path", required: true, schema: {type: "string"}}
        - {name: "q", in: "query", required: false, schema: {type: "string"}}
      responses:
        "200":
          description: "Matching pull requests"
          content:
            application/json:
              schema: {type: "object", required: ["pulls"], properties: {pulls: {type: array, items: {type: object, required: [number, title, state], properties: {number: {type: integer}, title: {type: string}, state: {type: string, enum: [open, draft, merged, closed]}}}}}}
  "/t3/threads/{id}/composer":
    get:
      operationId: "getT3ThreadComposer"
      summary: "Slash commands and skills for the composer: the repository's own (T3's scan of the thread folder) first, then the provider's global ones"
      parameters:
        - {name: "id", in: "path", required: true, schema: {type: "string"}}
        - {name: "provider", in: "query", required: true, schema: {type: "string"}}
      responses:
        "200":
          description: "Commands and skills"
          content:
            application/json:
              schema: {type: object, required: [commands, skills], properties: {commands: {type: array, items: {type: object, required: [name], properties: {name: {type: string}, description: {type: string}}}}, skills: {type: array, items: {type: object, required: [name], properties: {name: {type: string}, description: {type: string}}}}}}
  "/t3/threads/{id}/entries":
    get:
      operationId: "searchT3ThreadEntries"
      summary: "Files and folders of the thread's workspace (Dory's git worktree first, else T3's folder) for @ mentions"
      parameters:
        - {name: "id", in: "path", required: true, schema: {type: "string"}}
        - {name: "q", in: "query", required: false, schema: {type: "string"}}
      responses:
        "200":
          description: "Matching entries"
          content:
            application/json:
              schema: {type: "object", required: ["entries"], properties: {entries: {type: array, items: {type: object, required: [path, kind], properties: {path: {type: string}, kind: {type: string}}}}}}
  "/t3/threads/{id}/attachments/{aid}":
    get:
      operationId: "getT3ThreadAttachment"
      summary: "A file sent with a message of the thread, proxied from T3 inline for previews; name and mime are optional hints"
      parameters:
        - {name: "id", in: "path", required: true, schema: {type: "string"}}
        - {name: "aid", in: "path", required: true, schema: {type: "string"}}
        - {name: "name", in: "query", required: false, schema: {type: "string"}}
        - {name: "mime", in: "query", required: false, schema: {type: "string"}}
      responses:
        "200":
          description: "The file bytes with their content type"
  "/t3/threads/{id}/send":
    post:
      operationId: "sendT3ThreadTurn"
      summary: "Send a message: start it, queue it after the active turn (mode auto) or inject it into the active turn (mode steer); model fields are optional"
      parameters:
        - {name: "id", in: "path", required: true, schema: {type: "string"}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required: ["text"]
              properties:
                text: {type: "string"}
                mode: {type: "string", enum: ["auto", "steer"]}
                provider_id: {type: "string"}
                model: {type: "string"}
                skills: {type: "array", items: {type: "string"}, description: "$skills picked in the composer, sent as T3 context records"}
                mentions: {type: "array", items: {type: "string"}, description: "@paths picked in the composer, sent as T3 context records"}
                effort_option: {type: "string"}
                effort: {type: "string"}
                attachments: {type: "array", items: {$ref: "#/components/schemas/T3Attachment"}}
      responses:
        "204":
          description: "Sent"
  "/t3/threads/{id}/history":
    get:
      operationId: "getT3ThreadHistory"
      summary: "Read an older page of a thread's conversation; start from history_cursor of /view, then each page's next_cursor"
      parameters:
        - {name: "id", in: "path", required: true, schema: {type: "string"}}
        - {name: "cursor", in: "query", required: true, schema: {type: "string"}}
      responses:
        "200":
          description: "Older messages, oldest first"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  messages: {type: "array", items: {type: "object"}}
                  next_cursor: {type: "string"}
                  has_more: {type: "boolean"}
  "/t3/threads/{id}/attachments":
    post:
      operationId: "uploadT3Attachment"
      summary: "Upload one file to the thread's T3 instance (raw body, name in ?name=, type in Content-Type) to send it later with /send"
      parameters:
        - {name: "id", in: "path", required: true, schema: {type: "string"}}
        - {name: "name", in: "query", schema: {type: "string"}}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: "string", format: "binary"}
      responses:
        "200":
          description: "Uploaded"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/T3Attachment"}
  "/t3/threads/{id}/queue/{run_id}":
    patch:
      operationId: "editT3QueuedMessage"
      summary: "Replace the text of a queued message"
      parameters:
        - {name: "id", in: "path", required: true, schema: {type: "string"}}
        - {name: "run_id", in: "path", required: true, schema: {type: "string"}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: "object", required: ["text"], properties: {text: {type: "string"}}}
      responses:
        "204": {description: "Edited"}
    delete:
      operationId: "cancelT3QueuedMessage"
      summary: "Remove a message from the queue"
      parameters:
        - {name: "id", in: "path", required: true, schema: {type: "string"}}
        - {name: "run_id", in: "path", required: true, schema: {type: "string"}}
      responses:
        "204": {description: "Removed"}
  "/t3/threads/{id}/queue/{run_id}/reorder":
    post:
      operationId: "reorderT3QueuedMessage"
      summary: "Move a queued message before another one, or last with an empty before_run_id"
      parameters:
        - {name: "id", in: "path", required: true, schema: {type: "string"}}
        - {name: "run_id", in: "path", required: true, schema: {type: "string"}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: "object", properties: {before_run_id: {type: "string"}}}
      responses:
        "204": {description: "Moved"}
  "/t3/threads/{id}/queue/{run_id}/steer":
    post:
      operationId: "steerT3QueuedMessage"
      summary: "Inject a queued message into the active turn"
      parameters:
        - {name: "id", in: "path", required: true, schema: {type: "string"}}
        - {name: "run_id", in: "path", required: true, schema: {type: "string"}}
      responses:
        "204": {description: "Steered"}
  "/t3/threads/{id}/interrupt":
    post:
      operationId: "interruptT3Thread"
      summary: "Stop the active turn and hold the queue"
      parameters:
        - {name: "id", in: "path", required: true, schema: {type: "string"}}
      responses:
        "204": {description: "Stopped"}
  "/t3/threads/{id}/queue/resume":
    post:
      operationId: "resumeT3Queue"
      summary: "Release a held queue so its next message starts"
      parameters:
        - {name: "id", in: "path", required: true, schema: {type: "string"}}
      responses:
        "204": {description: "Resumed"}
  "/t3/threads/{id}/settings":
    patch:
      operationId: "setT3ThreadSettings"
      summary: "Change the interaction mode (default or plan) or the access level of a thread"
      parameters:
        - {name: "id", in: "path", required: true, schema: {type: "string"}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                interaction_mode: {type: "string", enum: ["default", "plan"]}
                runtime_mode: {type: "string", enum: ["approval-required", "auto-accept-edits", "auto", "full-access"]}
      responses:
        "204": {description: "Changed"}
  "/version":
    get:
      operationId: "getVersion"
      summary: "Build version of the running binary"
      responses:
        "200":
          description: "VCS revision embedded by go build, or dev without VCS data"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
  "/t3/status":
    get:
      operationId: "getT3Status"
      summary: "Live status of the T3 Code instances"
      responses:
        "200":
          description: "Latest polled status"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/T3Status"
  "/t3/usage":
    get:
      operationId: "getT3Usage"
      summary: "Latest plan limits and consumption of the T3 Code instances"
      responses:
        "200":
          description: "Latest polled usage"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/T3InstanceUsage"
  "/t3/usage/history":
    get:
      operationId: "getT3UsageHistory"
      summary: "Daily consumption of every T3 Code instance over the last days, read on demand"
      parameters:
        - name: "days"
          in: "query"
          required: true
          schema:
            type: "integer"
            minimum: 1
            maximum: 90
      responses:
        "200":
          description: "One entry per instance with its daily buckets in UTC days"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/T3InstanceHistory"
        "400":
          $ref: "#/components/responses/Error400"
  "/t3/usage/refresh":
    post:
      operationId: "refreshT3Usage"
      summary: "Force a new read of plan limits and consumption"
      responses:
        "200":
          description: "Usage after the forced read"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/T3InstanceUsage"
  "/t3-instances":
    get:
      operationId: "listT3Instances"
      responses:
        "200":
          description: "Success"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/T3Instance"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
      parameters:
        -
          name: "limit"
          in: "query"
          schema:
            type: "integer"
            default: 100
            minimum: 1
            maximum: 1000
        -
          name: "offset"
          in: "query"
          schema:
            type: "integer"
            default: 0
            minimum: 0
        -
          name: "include_archived"
          in: "query"
          schema:
            type: "boolean"
            default: false
