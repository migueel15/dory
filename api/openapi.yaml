components:
  responses:
    Error400:
      description: "Invalid input"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error401:
      description: "Authentication required"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error403:
      description: "Insufficient permission"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error404:
      description: "Resource not found"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error409:
      description: "Conflict"
      content:
        application/json:
          schema:
