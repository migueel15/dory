openapi: "3.0.3"
info:
  title: "Dory MVP API"
  version: "0.1.0"
  description: "REST contract over internal/service. Deletes archive records; each mutation atomically appends an audit event. Lists are bare arrays. Read operations require read permission; mutations require write (admin includes both). Credential hashes are never exposed."
servers:
  -
    url: "/api"
security:
  -
    sessionCookie: []
  -
    bearerAuth: []
paths:
  "/notifications":
    get:
      operationId: listNotifications
      parameters:
        - name: before
          in: query
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Global per-user notification history, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items, unread, server_time]
                properties:
                  unread: { type: integer }
                  server_time: { type: string, format: date-time }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, title, body, url, kinds, bell, toast, read, created_at]
                      properties:
                        id: { type: integer, format: int64 }
                        title: { type: string, description: "Short heading: state and project" }
                        body: { type: string, description: "First line of the item or thread title, up to 80 characters" }
                        url: { type: string }
                        kinds: { type: array, items: { type: string } }
                        bell: { type: boolean }
                        toast: { type: boolean }
                        read: { type: boolean }
                        created_at: { type: string, format: date-time }
    delete:
      operationId: clearNotifications
      responses:
        "204": { description: Whole notification history of the authenticated user deleted }
  "/notifications/{id}/read":
    post:
      operationId: readNotification
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Notification marked read for the authenticated user }
  "/notifications/preferences":
    get:
      operationId: getNotificationPreferences
      responses:
        "200":
          description: User preferences and VAPID public key
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: "#/components/schemas/NotificationSettings" }
                  public_key: { type: string }
    put:
      operationId: putNotificationPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettings" }
      responses:
        "204": { description: Preferences replaced; existing notices are preserved }
  "/notifications/subscription":
    post:
      operationId: subscribeNotifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string, format: uri }
                keys:
                  type: object
                  required: [auth, p256dh]
                  properties:
                    auth: { type: string }
                    p256dh: { type: string }
      responses:
        "204": { description: Device subscription stored }
    delete:
      operationId: unsubscribeNotifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string, format: uri }
      responses:
        "204": { description: Device subscription and queued deliveries removed }
  "/projects":
    get:
      operationId: "listProjects"
      responses:
        "200":
          description: "Success"
          content:
            application/json:
              schema:
                type: "array"
