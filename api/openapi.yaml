          readOnly: true
        updated_at:
          type: "string"
          format: "date-time"
          readOnly: true
        archived_at:
          type: "string"
          format: "date-time"
          nullable: true
          readOnly: true
        name:
          type: "string"
        os:
          type: "string"
          default: ""
        access:
          type: "string"
          default: ""
        agents_available:
          type: "array"
          items:
            type: "string"
        notes:
          type: "string"
          default: ""
    EnvironmentInput:
      type: "object"
      additionalProperties: false
      required:
        - "name"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        os:
          type: "string"
          default: ""
        access:
          type: "string"
          default: ""
        agents_available:
          type: "array"
          items:
            type: "string"
        notes:
          type: "string"
          default: ""
    RepositoryLocation:
      type: "object"
      required:
        - "id"
        - "created_at"
        - "updated_at"
        - "archived_at"
        - "repository_id"
        - "environment_id"
        - "path"
      properties:
        id:
          type: "string"
          format: "uuid"
          readOnly: true
        created_at:
          type: "string"
          format: "date-time"
          readOnly: true
        updated_at:
          type: "string"
          format: "date-time"
          readOnly: true
        archived_at:
          type: "string"
          format: "date-time"
          nullable: true
          readOnly: true
        repository_id:
          type: "string"
          format: "uuid"
        environment_id:
          type: "string"
          format: "uuid"
        path:
          type: "string"
    RepositoryLocationInput:
      type: "object"
      additionalProperties: false
      required:
        - "repository_id"
        - "environment_id"
        - "path"
      properties:
        id:
          type: "string"
          format: "uuid"
        repository_id:
          type: "string"
          format: "uuid"
        environment_id:
          type: "string"
          format: "uuid"
        path:
          type: "string"
    GithubRef:
      type: "object"
      required: ["number", "title"]
      properties:
        number:
          type: "integer"
        title:
          type: "string"
    GithubIssue:
      type: "object"
      required: ["repo", "project_id", "number", "title", "author", "url", "state", "updated_at", "labels", "pulls", "milestone", "state_reason", "created_at", "closed_at", "comments", "assignees", "label_colors"]
      properties:
        repo:
          type: "string"
        project_id:
          type: "string"
        number:
          type: "integer"
        title:
          type: "string"
        author:
          type: "string"
        url:
          type: "string"
        state:
          type: "string"
        updated_at:
          type: "string"
        labels:
          type: "array"
          items:
            type: "string"
        pulls:
          type: "array"
          items:
            $ref: "#/components/schemas/GithubRef"
        milestone:
          type: "string"
        state_reason:
          type: "string"
          description: "COMPLETED, NOT_PLANNED or REOPENED; empty when unknown."
        created_at:
          type: "string"
        closed_at:
          type: "string"
          description: "Empty while open."
        comments:
          type: "integer"
        assignees:
          type: "array"
          items:
            type: "string"
        label_colors:
          type: "object"
          description: "Hex color of each label, without #."
          additionalProperties:
            type: "string"
    GithubPull:
