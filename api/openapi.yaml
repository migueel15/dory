  "/github/open":
    get:
      operationId: "getGithubOverview"
      summary: "Open issues and pull requests of the registered repositories"
      parameters:
        - {name: "refresh", in: "query", schema: {type: "boolean"}}
      responses:
        "200":
          description: "Grouped by type, newest first"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GithubOverview"
  "/github/repos/{owner}/{repo}/{kind}/{number}":
    get:
      operationId: "getGithubDetail"
      summary: "Issue or pull request with its timeline"
      parameters:
        - {name: "owner", in: "path", required: true, schema: {type: "string"}}
        - {name: "repo", in: "path", required: true, schema: {type: "string"}}
        - {name: "kind", in: "path", required: true, schema: {type: "string", enum: ["issues", "pulls"]}}
        - {name: "number", in: "path", required: true, schema: {type: "integer"}}
      responses:
        "200":
          description: "Detail"
          content:
            application/json:
              schema:
