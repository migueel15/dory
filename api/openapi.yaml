openapi: "3.0.3"
info:
  title: "Dory MVP API"
  version: "0.1.0"
  description: "REST contract over internal/service. Deletes archive records; each mutation atomically appends an audit event. Lists are bare arrays. Read operations require read permission; mutations require write (admin includes both). Credential hashes are never exposed."
servers:
  -
    url: "/api"
security:
  -
    sessionCookie: []
  -
    bearerAuth: []
paths:
  "/projects":
    get:
      operationId: "listProjects"
      responses:
        "200":
          description: "Success"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
      parameters:
        -
          name: "limit"
          in: "query"
          schema:
            type: "integer"
            default: 100
            minimum: 1
            maximum: 1000
        -
          name: "offset"
          in: "query"
          schema:
            type: "integer"
            default: 0
            minimum: 0
        -
          name: "include_archived"
          in: "query"
          schema:
            type: "boolean"
            default: false
        -
          name: "filter"
          in: "query"
          description: "JSON object of exact domain field matches; arrays use containment."
          content:
            application/json:
              schema:
                type: "object"
                additionalProperties: true
    post:
      operationId: "createProject"
      responses:
        "200":
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      description: "Upsert by optional client-generated ID. Returns 200 for both insert and replacement. Appends an audit event."
  "/projects/{id}":
    parameters:
      -
        name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
