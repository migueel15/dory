      parameters:
        -
          name: "limit"
          in: "query"
          schema:
            type: "integer"
            default: 100
            minimum: 1
            maximum: 1000
        -
          name: "offset"
          in: "query"
          schema:
            type: "integer"
            default: 0
            minimum: 0
        -
          name: "include_archived"
          in: "query"
          schema:
            type: "boolean"
            default: false
        -
          name: "filter"
          in: "query"
          description: "JSON object of exact domain field matches; arrays use containment."
          content:
            application/json:
              schema:
                type: "object"
                additionalProperties: true
    post:
