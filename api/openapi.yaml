          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
      parameters:
        -
          name: "q"
          in: "query"
          schema:
            type: "string"
          required: true
        -
          name: "limit"
          in: "query"
          schema:
            type: "integer"
            default: 100
            maximum: 1000
            minimum: 1
        -
          name: "offset"
          in: "query"
          schema:
            type: "integer"
            default: 0
            minimum: 0
  "/events/stream":
    get:
      operationId: "streamEvents"
      description: "SSE audit stream ordered by event ID. Each message has id, event: change and JSON Event data. Resume using after or Last-Event-ID (header takes precedence); after=latest starts at the newest event, skipping history. Heartbeat comments are allowed."
      parameters:
        -
          name: "after"
          in: "query"
          schema:
            oneOf:
              -
                type: "integer"
                format: "int64"
                minimum: 0
              -
                type: "string"
                enum: ["latest"]
            default: 0
        -
          name: "entity_type"
          in: "query"
          schema:
            type: "string"
        -
          name: "Last-Event-ID"
          in: "header"
          schema:
            type: "integer"
            format: "int64"
            minimum: 0
      responses:
        "200":
          description: "Audit stream"
          content:
            text/event-stream:
              schema:
                type: "string"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
  "/auth/login":
    post:
      operationId: "login"
      responses:
        "200":
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          headers:
            Set-Cookie:
              description: "Session cookie; HttpOnly, Secure, SameSite=Lax, Path=/"
              schema:
                type: "string"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
        "429":
          description: "Too many login attempts"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "username"
                - "password"
              properties:
                username:
                  type: "string"
                password:
                  type: "string"
                  format: "password"
                  writeOnly: true
  "/auth/logout":
    post:
      operationId: "logout"
      responses:
        "204":
          description: "Session archived and cookie expired using Set-Cookie"
          headers:
            Set-Cookie:
              schema:
                type: "string"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
  "/auth/me":
    get:
      operationId: "me"
      responses:
        "200":
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
components:
  responses:
    Error400:
      description: "Invalid input"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error401:
      description: "Authentication required"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error403:
      description: "Insufficient permission"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error404:
      description: "Resource not found"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error409:
      description: "Conflict"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error500:
      description: "Internal error"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  securitySchemes:
