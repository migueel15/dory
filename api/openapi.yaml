          $ref: "#/components/responses/Error500"
  "/search":
    get:
      operationId: "search"
      responses:
        "200":
          description: "Success"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/SearchHit"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
      parameters:
        -
          name: "q"
          in: "query"
          schema:
            type: "string"
          required: true
        -
          name: "limit"
          in: "query"
          schema:
            type: "integer"
            default: 100
            maximum: 1000
            minimum: 1
        -
          name: "offset"
          in: "query"
          schema:
            type: "integer"
            default: 0
            minimum: 0
  "/events/stream":
    get:
      operationId: "streamEvents"
      description: "SSE audit stream ordered by event ID. Each message has id, event: change and JSON Event data. Resume using after or Last-Event-ID (header takes precedence); after=latest starts at the newest event, skipping history. Heartbeat comments are allowed. Changes of the T3 monitor arrive as event: change with data {\"entity_type\":\"t3\"} and no id; they cannot be resumed."
      parameters:
        -
          name: "after"
          in: "query"
          schema:
            oneOf:
              -
                type: "integer"
                format: "int64"
                minimum: 0
              -
                type: "string"
                enum: ["latest"]
            default: 0
        -
          name: "entity_type"
          in: "query"
          schema:
            type: "string"
        -
          name: "Last-Event-ID"
          in: "header"
          schema:
            type: "integer"
            format: "int64"
            minimum: 0
      responses:
        "200":
          description: "Audit stream"
          content:
            text/event-stream:
              schema:
                type: "string"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
  "/auth/login":
    post:
      operationId: "login"
      responses:
        "200":
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          headers:
            Set-Cookie:
              description: "Session cookie; HttpOnly, Secure, SameSite=Lax, Path=/"
              schema:
                type: "string"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
        "429":
          description: "Too many login attempts"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "username"
                - "password"
              properties:
                username:
                  type: "string"
                password:
                  type: "string"
                  format: "password"
                  writeOnly: true
  "/auth/logout":
    post:
      operationId: "logout"
      responses:
        "204":
          description: "Session archived and cookie expired using Set-Cookie"
          headers:
            Set-Cookie:
              schema:
                type: "string"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
  "/auth/me":
    get:
      operationId: "me"
      responses:
        "200":
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
  "/github/repos/{owner}/{repo}/pulls/{number}/resolve-conflicts":
    post:
      operationId: resolveConflicts
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
        - {name: repo, in: path, required: true, schema: {type: string}}
        - {name: number, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instance_id, project_id, provider, model]
              properties:
                instance_id: {type: string}
                project_id: {type: string}
                provider: {type: string}
                model: {type: string}
                effort_option: {type: string}
                effort: {type: string}
      responses:
        "201":
          description: Thread launched
          content:
            application/json:
              schema:
                type: object
                required: [thread_id]
                properties:
                  thread_id: {type: string}
        "409":
          $ref: "#/components/responses/Error409"
        "400":
          $ref: "#/components/responses/Error400"
        "502":
          description: GitHub or T3 unavailable
  "/items/{id}/plans":
    get:
      operationId: listItemPlans
      description: "Plan versions of the item, newest first."
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: "Success"
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ItemPlan"}
        "404":
          $ref: "#/components/responses/Error404"
    post:
      operationId: createItemPlan
      description: "Store a plan version written by the user. It never makes the item ready; an inbox or ready item goes back to triaged."
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sections]
              properties:
                sections: {$ref: "#/components/schemas/PlanSections"}
                open_questions: {type: array, items: {type: string}}
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ItemPlan"}
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
  "/items/{id}/plan/accept":
    post:
      operationId: acceptItemPlan
      description: "Accept the newest plan version: copy it to body_md and move the item to ready. Fails while the plan has open questions."
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: "Accepted"
          content:
            application/json:
              schema:
                type: object
                required: [item, plan]
                properties:
                  item: {$ref: "#/components/schemas/Item"}
                  plan: {$ref: "#/components/schemas/ItemPlan"}
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
  "/items/{id}/title/regenerate":
    post:
      operationId: regenerateItemTitle
      description: "Retry the AI title of an item whose title_source is fallback. The item goes back to pending while the title is generated in the background."
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: "Generation launched; the item is pending"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Item"}
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "503":
          description: "Title generation is not configured"
  "/items/{id}/refine":
    post:
      operationId: refineItem
      description: "Send a message to the single definition thread of the item. Without a thread, or with restart, it launches one (instance_id, project_id, provider and model required) and moves an inbox item to triaged."
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: {type: string}
                restart: {type: boolean}
                instance_id: {type: string}
                project_id: {type: string}
                provider: {type: string}
                model: {type: string}
                effort_option: {type: string}
                effort: {type: string}
      responses:
        "200":
          description: "Message sent to the existing thread"
          content:
            application/json:
              schema: {type: object, required: [thread_id], properties: {thread_id: {type: string}}}
        "201":
          description: "Definition thread launched"
          content:
            application/json:
              schema: {type: object, required: [thread_id], properties: {thread_id: {type: string}}}
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "502":
          description: T3 unavailable
  "/items/{id}/refinement":
    get:
      operationId: getItemRefinement
      description: "Definition state of the item: its thread, every message, the open request and the newest plan. thread_error explains an empty chat when the thread cannot be read."
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: "Success"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ItemRefinement"}
        "404":
          $ref: "#/components/responses/Error404"
  "/dictation":
    post:
      operationId: createDictation
      summary: "Start a dictation session (in memory, expires after 30 min)"
      responses:
        "201":
          description: "Session created"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DictationState"}
        "503":
          description: "Dictation engine not configured (DORY_WHISPER_URL)"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  "/dictation/{id}":
    get:
      operationId: getDictation
      summary: "Partial text and pending batches"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: "Session state"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DictationState"}
        "404":
          $ref: "#/components/responses/Error404"
  "/dictation/{id}/chunks":
    post:
      operationId: addDictationChunk
      summary: "Queue a self-contained WAV batch (16 kHz mono); seq starts at 0"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: seq, in: query, required: true, schema: {type: integer, minimum: 0}}
      requestBody:
        required: true
        content:
          audio/wav:
            schema: {type: string, format: binary}
      responses:
        "202":
          description: "Batch queued"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DictationState"}
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
  "/dictation/{id}/finish":
    post:
      operationId: finishDictation
      summary: "insert waits for the last batch and returns the text; send returns at once and the backend delivers the text to target"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: {type: string, enum: [insert, send]}
                target:
                  type: object
                  required: [kind]
                  properties:
                    kind: {type: string, enum: [capture, define]}
                    project_id: {type: string, description: "capture: project of the new inbox item"}
                    item_id: {type: string, description: "define: item whose definition thread receives the text"}
      responses:
        "200":
          description: "insert: final text"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DictationState"}
        "202":
          description: "send: delivery scheduled"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DictationState"}
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
components:
  responses:
    Error400:
      description: "Invalid input"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error401:
      description: "Authentication required"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error403:
      description: "Insufficient permission"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error404:
      description: "Resource not found"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error409:
      description: "Conflict"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error500:
      description: "Internal error"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  securitySchemes:
    sessionCookie:
      type: "apiKey"
      in: "cookie"
      name: "dory_session"
    bearerAuth:
      type: "http"
      scheme: "bearer"
  schemas:
    T3Attachment:
      type: "object"
      required: ["type", "id", "name", "mime_type", "size_bytes"]
      properties:
        type: {type: "string", enum: ["image", "file"]}
        id: {type: "string"}
        name: {type: "string"}
        mime_type: {type: "string"}
        size_bytes: {type: "integer"}
    DictationState:
      type: object
      required: [id, text, pending, status]
      properties:
        id: {type: string}
        text: {type: string}
        pending: {type: integer}
        status: {type: string, enum: [recording, finishing, done, failed]}
        error: {type: string}
    ItemRefinement:
      type: object
      required: [thread, messages, pending, plan]
      properties:
        thread:
          type: object
          nullable: true
          required: [thread_id, instance_id, status, attention, url, model, effort]
          properties:
            thread_id: {type: string}
            instance_id: {type: string}
            status: {type: string, description: "Empty when no instance reports the thread right now"}
            attention: {type: boolean}
            url: {type: string}
            model: {type: string}
            effort: {type: string}
        messages: {$ref: "#/components/schemas/T3ThreadContext/properties/messages"}
        pending: {$ref: "#/components/schemas/T3ThreadContext/properties/pending"}
        thread_error: {type: string}
        plan:
          allOf: [{$ref: "#/components/schemas/ItemPlan"}]
          nullable: true
    PlanSections:
      type: object
      required: [goal, scope, where, design, requirements, validation, risks]
      properties:
        goal: {type: string}
        scope: {type: string}
        where: {type: string}
        design: {type: string}
        requirements: {type: string}
        validation: {type: string}
        risks: {type: string}
    ItemPlan:
      type: object
      required: [id, created_at, updated_at, archived_at, item_id, version, sections, open_questions, author, accepted_at]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        created_at: {type: string, format: date-time, readOnly: true}
        updated_at: {type: string, format: date-time, readOnly: true}
        archived_at: {type: string, format: date-time, nullable: true, readOnly: true}
        item_id: {type: string, format: uuid}
        version: {type: integer}
        sections: {$ref: "#/components/schemas/PlanSections"}
        open_questions: {type: array, items: {type: string}}
        author: {type: string, enum: [agent, user]}
        accepted_at: {type: string, format: date-time, nullable: true}
    TitleSettings:
      type: object
      required: [enabled, instance_id, provider, model, effort, project, timeout_seconds]
      properties:
        enabled: { type: boolean }
        instance_id: { type: string, description: T3 instance where the thread runs }
        provider: { type: string, description: Provider instance inside T3 }
        model: { type: string, description: Model slug }
        effort: { type: string, description: Reasoning effort; empty uses the lowest of the model }
        project: { type: string, description: T3 project id; empty uses the first }
        timeout_seconds: { type: integer, minimum: 0, maximum: 3600, description: 0 means the 120 s default }
    NotificationSettings:
      type: object
      additionalProperties: false
      properties:
        item_ready: { $ref: "#/components/schemas/NotificationChannels" }
        item_blocked: { $ref: "#/components/schemas/NotificationChannels" }
        thread_finished: { $ref: "#/components/schemas/NotificationChannels" }
        thread_attention: { $ref: "#/components/schemas/NotificationChannels" }
    NotificationChannels:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: boolean, default: true }
        bell: { type: boolean, default: true }
        toast: { type: boolean, default: true }
        push: { type: boolean, default: true }
    IssueThread:
      type: object
      required: [id, kind, repo, number, issue_url, title, instance_id, thread_id, model, effort, created_at]
      properties:
        id: {type: string}
        kind: {type: string, enum: [define_issue, resolve_conflicts, review], default: define_issue}
        project_id: {type: string, nullable: true}
        repo: {type: string}
        number: {type: integer}
        issue_url: {type: string}
        title: {type: string}
        instance_id: {type: string}
        thread_id: {type: string}
        model: {type: string}
        effort: {type: string}
        created_at: {type: string}
    EntityType:
      type: "string"
      enum:
        - "project"
        - "repository"
        - "environment"
        - "feature"
        - "item"
        - "memory"
    Error:
      type: "object"
      required:
        - "error"
      properties:
        error:
          type: "object"
          required:
            - "code"
            - "message"
          properties:
            code:
              type: "string"
            message:
              type: "string"
    Project:
      type: "object"
      required:
        - "id"
        - "created_at"
        - "updated_at"
        - "archived_at"
        - "slug"
        - "name"
        - "description"
        - "status"
        - "stack"
      properties:
        id:
          type: "string"
          format: "uuid"
          readOnly: true
        created_at:
          type: "string"
          format: "date-time"
          readOnly: true
        updated_at:
          type: "string"
          format: "date-time"
          readOnly: true
        archived_at:
          type: "string"
          format: "date-time"
          nullable: true
          readOnly: true
        slug:
          type: "string"
        name:
          type: "string"
        description:
          type: "string"
          default: ""
        status:
          type: "string"
          default: "active"
        stack:
          type: "array"
          items:
            type: "string"
    ProjectInput:
      type: "object"
      additionalProperties: false
      required:
        - "slug"
        - "name"
      properties:
        id:
          type: "string"
          format: "uuid"
        slug:
          type: "string"
        name:
          type: "string"
        description:
          type: "string"
          default: ""
        status:
          type: "string"
          default: "active"
        stack:
          type: "array"
          items:
            type: "string"
    Repository:
      type: "object"
      required:
        - "id"
        - "created_at"
        - "updated_at"
        - "archived_at"
        - "project_id"
        - "remote_url"
        - "default_branch"
      properties:
        id:
          type: "string"
          format: "uuid"
          readOnly: true
        created_at:
          type: "string"
          format: "date-time"
          readOnly: true
        updated_at:
          type: "string"
          format: "date-time"
          readOnly: true
        archived_at:
          type: "string"
          format: "date-time"
          nullable: true
          readOnly: true
        project_id:
          type: "string"
          format: "uuid"
        remote_url:
          type: "string"
        default_branch:
          type: "string"
          default: "main"
    RepositoryInput:
      type: "object"
      additionalProperties: false
      required:
        - "project_id"
        - "remote_url"
      properties:
        id:
          type: "string"
          format: "uuid"
        project_id:
          type: "string"
          format: "uuid"
        remote_url:
          type: "string"
        default_branch:
          type: "string"
          default: "main"
    Environment:
      type: "object"
      required:
        - "id"
        - "created_at"
        - "updated_at"
        - "archived_at"
        - "name"
        - "os"
        - "access"
        - "agents_available"
        - "notes"
      properties:
        id:
          type: "string"
          format: "uuid"
          readOnly: true
        created_at:
          type: "string"
          format: "date-time"
          readOnly: true
        updated_at:
          type: "string"
          format: "date-time"
          readOnly: true
        archived_at:
          type: "string"
          format: "date-time"
          nullable: true
          readOnly: true
        name:
          type: "string"
        os:
          type: "string"
          default: ""
        access:
          type: "string"
          default: ""
        agents_available:
          type: "array"
          items:
            type: "string"
        notes:
          type: "string"
          default: ""
    EnvironmentInput:
      type: "object"
      additionalProperties: false
      required:
        - "name"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        os:
          type: "string"
          default: ""
        access:
          type: "string"
          default: ""
        agents_available:
          type: "array"
          items:
            type: "string"
        notes:
          type: "string"
          default: ""
    RepositoryLocation:
      type: "object"
      required:
        - "id"
        - "created_at"
        - "updated_at"
        - "archived_at"
        - "repository_id"
        - "environment_id"
        - "path"
      properties:
        id:
          type: "string"
          format: "uuid"
          readOnly: true
        created_at:
          type: "string"
          format: "date-time"
          readOnly: true
        updated_at:
          type: "string"
          format: "date-time"
          readOnly: true
        archived_at:
          type: "string"
          format: "date-time"
          nullable: true
          readOnly: true
        repository_id:
          type: "string"
          format: "uuid"
        environment_id:
          type: "string"
          format: "uuid"
        path:
          type: "string"
    RepositoryLocationInput:
      type: "object"
      additionalProperties: false
      required:
        - "repository_id"
        - "environment_id"
        - "path"
      properties:
        id:
          type: "string"
          format: "uuid"
        repository_id:
          type: "string"
          format: "uuid"
        environment_id:
          type: "string"
          format: "uuid"
        path:
