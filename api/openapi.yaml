      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required: ["text"]
              properties:
                text:
                  type: "string"
      responses:
        "204":
          description: "Sent"
  "/t3/threads/{id}/requests/{request_id}":
    post:
      operationId: "respondT3ThreadRequest"
      summary: "Approve, decline or answer the open request of a thread"
      parameters:
        - {name: "id", in: "path", required: true, schema: {type: "string"}}
        - {name: "request_id", in: "path", required: true, schema: {type: "string"}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                decision:
                  type: "string"
                  enum: ["accept", "decline"]
                answers:
                  type: "object"
                  additionalProperties: true
      responses:
        "204":
          description: "Delivered"
        "409":
          description: "The request is no longer open"
