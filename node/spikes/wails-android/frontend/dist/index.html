<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dory spike</title>
<style>
  :root { color-scheme: light dark; --ok:#1a7f37; --bad:#cf222e; --mut:#6e7781; }
  body { font: 15px/1.4 system-ui, sans-serif; margin: 0; padding: 12px 16px 48px; }
  h1 { font-size: 18px; margin: 4px 0 12px; }
  .row { border: 1px solid #8884; border-radius: 8px; padding: 10px; margin: 8px 0; }
  .row h2 { font-size: 15px; margin: 0 0 4px; display: flex; justify-content: space-between; }
  .badge { font-weight: 700; padding: 0 8px; border-radius: 10px; color: #fff; background: var(--mut); }
  .badge.ok { background: var(--ok); } .badge.err { background: var(--bad); }
  .detail { color: var(--mut); font-size: 12px; word-break: break-word; white-space: pre-wrap; }
  button { font: inherit; padding: 6px 12px; margin: 6px 6px 0 0; }
  video { width: 100%; max-height: 40vh; background: #000; display: none; }
  #meta { font-size: 12px; color: var(--mut); }
</style>
</head>
<body>
<h1>Dory · Wails v3 Android spike</h1>
<div id="meta">loading…</div>
<button id="runAll">Run all (not camera)</button>

<div class="row" id="r-handler"><h2>1 · In-process http.Handler <span class="badge">–</span></h2><div class="detail"></div></div>
<div class="row" id="r-sqlite"><h2>2 · SQLite write/close/reread <span class="badge">–</span></h2><div class="detail"></div></div>
<div class="row" id="r-camera"><h2>3 · Camera + QR <span class="badge">–</span></h2><div class="detail">Press "Scan QR" and show any QR code to the camera.</div>
  <video id="video" playsinline muted></video><button id="scan">Scan QR</button><button id="stopScan">Stop</button></div>
<div class="row" id="r-mdns"><h2>4 · mDNS _dory._tcp <span class="badge">–</span></h2><div class="detail"></div></div>
<div class="row" id="r-mtls"><h2>5 · mutual-TLS listener <span class="badge">–</span></h2><div class="detail"></div></div>
<div class="row" id="r-background"><h2>6 · Stays alive in background <span class="badge">–</span></h2><div class="detail"></div>
  <button id="fgOn">Foreground service ON</button><button id="fgOff">OFF</button><button id="bgRefresh">Refresh</button></div>

<script src="jsqr.js"></script>
<script src="app.js"></script>
</body>
</html>
