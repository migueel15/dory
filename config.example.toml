# Copia este fichero a ~/.config/dory/config.toml. Todas las claves son
# opcionales y cada una se puede sobrescribir con una variable DORY_*.

# Dirección de escucha del nodo (DORY_LISTEN). En escritorio, localhost.
listen = "127.0.0.1:7700"

# Carpeta de datos del nodo (DORY_DATA_DIR): base SQLite, hilos y worktrees.
# Por defecto, ~/.dory/data en instalaciones nuevas.
# data_dir = "/home/miguel/.dory/data"

# Nombre del nodo en la malla (DORY_NODE_NAME). Por defecto, el nombre del equipo.
# node_name = "arch-laptop"

# Cookie de sesión solo por HTTPS (DORY_COOKIE_SECURE). Actívala en un servidor
# detrás de un proxy TLS.
# cookie_secure = true

# Origen público por HTTPS (DORY_PUBLIC_ORIGIN) si el nodo está detrás de un proxy.
# public_origin = "https://dory.dorlab.net"

# Duración de la sesión web (DORY_SESSION_TTL), formato de Go: "168h" = 7 días.
session_ttl = "168h"
