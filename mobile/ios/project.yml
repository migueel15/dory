# Xcode project of the iOS app. CI generates Dory.xcodeproj with XcodeGen
# (`xcodegen generate`), so no Mac is needed to change it.
name: Dory
options:
  bundleIdPrefix: net.dorlab
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Dory:
    type: application
    platform: iOS
    sources:
      - path: Dory
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: Dory
        PRODUCT_BUNDLE_IDENTIFIER: net.dorlab.dory
        INFOPLIST_FILE: Dory/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "NO"
        # The IPA is unsigned: SideStore or AltStore sign it with the user's Apple ID.
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
schemes:
  Dory:
    build:
      targets:
        Dory: all
    archive:
      config: Release
