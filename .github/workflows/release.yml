# Binaries and desktop apps for every channel (requirement 4.6):
# - a tag v* publishes a stable release,
# - once a day, if main changed, the "nightly" release is refreshed (it can
#   also be run by hand),
# - a pull request only runs the tests and the core binaries, to save minutes
#   (macOS counts x10 and Windows x2).
name: release

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  # The daily run is skipped when the nightly already points at this commit.
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=true
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            current=$(gh api "repos/$GITHUB_REPOSITORY/commits/nightly" -q .sha 2>/dev/null || true)
            [ "$current" = "$GITHUB_SHA" ] && build=false
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  binaries:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd web && npm ci --include=dev && npm run build
      - run: go test ./...
      - name: Build
        run: |
          channel=nightly; [ "$GITHUB_REF_TYPE" = tag ] && channel=stable
          mkdir -p out
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-X github.com/migueel15/dory/internal/version.Channel=$channel" -o out/dory-$os-$arch$ext ./cmd/dory
          done
      - uses: actions/upload-artifact@v4
        with: { name: binaries, path: out/ }

  desktop:
    needs: binaries
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, bin: dory-linux-amd64, name: dory, flag: --linux }
          - { os: macos-latest, bin: dory-darwin-arm64, name: dory, flag: --mac }
          - { os: windows-latest, bin: dory-windows-amd64.exe, name: dory.exe, flag: --win }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: binaries, path: out }
      - name: Bundle the core
        shell: bash
        run: mkdir -p desktop/bin && cp out/${{ matrix.bin }} desktop/bin/${{ matrix.name }} && chmod +x desktop/bin/${{ matrix.name }}
      - name: Version the app
        shell: bash
        run: |
          # electron-updater only installs a higher version: stable takes the
          # tag, nightly a prerelease that grows with each run.
          if [ "$GITHUB_REF_TYPE" = tag ]; then v=${GITHUB_REF_NAME#v}; else v=$(node -p "require('./desktop/package.json').version")-nightly.$GITHUB_RUN_NUMBER; fi
          cd desktop && npm version --no-git-tag-version --allow-same-version "$v"
      - run: cd desktop && npm ci && npx electron-builder ${{ matrix.flag }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml

  publish:
    # Only main and the tags publish; a manual run on another branch only builds.
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
    needs: [binaries, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: assets, merge-multiple: true }
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            gh release create "$GITHUB_REF_NAME" assets/* --title "$GITHUB_REF_NAME" --generate-notes
          else
            gh release delete nightly --yes --cleanup-tag || true
            gh release create nightly assets/* --prerelease --title "Nightly" --notes "Build de $(git rev-parse --short HEAD) en main." --target "$GITHUB_SHA"
          fi
