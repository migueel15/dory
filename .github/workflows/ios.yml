name: ios

on:
  push:
    branches: [main]
    paths:
      - 'mobile/ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'mobile/ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd mobile/ios && xcodegen generate
      - name: Build the app without signing
        run: |
          cd mobile/ios
          xcodebuild -project Dory.xcodeproj -scheme Dory -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E 'error:' build.log | sort -u | head -60; tail -n 60 build.log; exit 1; }
          grep -E 'warning:' build.log | sort -u | head -60 || true
      - name: Package the IPA
        run: |
          mkdir -p ipa/Payload
          cp -R mobile/ios/build/Build/Products/Release-iphoneos/Dory.app ipa/Payload/
          (cd ipa && zip -qry ../dory-ios.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: dory-ios-ipa
          path: dory-ios.ipa
      - name: Publish independent iOS build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ios-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" dory-ios.ipa --target "$GITHUB_SHA" --prerelease --title "iOS ${GITHUB_RUN_NUMBER}" --notes "Compilación iOS sin firmar del commit ${GITHUB_SHA}. Instálala con SideStore o AltStore: ver docs/ios.md."
