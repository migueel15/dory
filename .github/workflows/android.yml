name: android

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools' }
      - run: cd mobile && npm ci && npx cap sync android
      - name: Configure signing when a keystore is available
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/dory.keystore"
            echo "DORY_ANDROID_KEYSTORE=$RUNNER_TEMP/dory.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        env:
          DORY_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          DORY_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DORY_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd mobile/android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dory-android-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish independent Android build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk dory-android.apk
          gh release create "android-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" dory-android.apk --target "$GITHUB_SHA" --prerelease --title "Android ${GITHUB_RUN_NUMBER}" --notes "Compilación Android del commit ${GITHUB_SHA}. Comprueba la firma antes de actualizar una instalación existente."
